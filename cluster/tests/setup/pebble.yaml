# [Pebble](https://github.com/letsencrypt/pebble)
# is the light-weight testing implementation of an ACME test server.
# Installing it in the cluster increases end-to-end test coverage
# by exercising the cert-manager machinery properly,
# compared to the auto-issuer setup.

# ClusterIssuer for test TLS certificates, backed by Pebble's ACME server.
# https://cert-manager.io/docs/reference/api-docs/#cert-manager.io/v1.ClusterIssuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  # The special name `test-issuer` is used here, and in `auto-issuer.yaml`, and in the tests.
  name: test-issuer
spec:
  acme:
    email: user@pebble.test
    server: https://pebble.cert-manager.svc.cluster.local:14000/dir
    skipTLSVerify: true
    privateKeySecretRef:
      name: pebble-account-key
    # Pebble auto-validates all challenges (PEBBLE_VA_ALWAYS_VALID),
    # but cert-manager still requires a solver to be configured.
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: the-vimana-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pebble-config
  namespace: cert-manager
data:
  pebble-config.json: |
    {
      "pebble": {
        "listenAddress": "0.0.0.0:14000",
        "managementListenAddress": "0.0.0.0:15000",
        "certificate": "test/certs/localhost/cert.pem",
        "privateKey": "test/certs/localhost/key.pem",
        "httpPort": 5002,
        "tlsPort": 5001,
        "ocspResponderURL": "",
        "externalAccountBindingRequired": false
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: cert-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pebble
  template:
    metadata:
      labels:
        app: pebble
    spec:
      containers:
      - name: pebble
        image: ghcr.io/letsencrypt/pebble:latest
        args:
        - -config
        - /test/pebble-config.json
        ports:
        - name: acme
          containerPort: 14000
        - name: management
          containerPort: 15000
        env:
        # Automatically approve any requests.
        - name: PEBBLE_VA_ALWAYS_VALID
          value: "1"
        # Skip validation delays.
        - name: PEBBLE_VA_NOSLEEP
          value: "1"
        volumeMounts:
        - name: config
          mountPath: /test/pebble-config.json
          subPath: pebble-config.json
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: pebble-config
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: cert-manager
spec:
  selector:
    app: pebble
  ports:
  - name: acme
    port: 14000
    targetPort: acme
  - name: management
    port: 15000
    targetPort: management
